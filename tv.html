<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drinks & Wins TV — Trivia en Pantalla Completa</title>
  <link rel="icon" href="img/logo.jpg" />
  <link rel="stylesheet" href="css/styles.css?v=193.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900;950&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Canvas Confetti for Podium Grand Finale -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* TV Ultra-Wide & High Contrast Styles */
    body.trivia-tv-fullscreen {
      background: radial-gradient(circle at center top, #141f36 0%, #080c14 100%);
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tv-header-strip {
      background: rgba(10, 14, 22, 0.95);
      border-bottom: 2px solid rgba(255, 209, 0, 0.35);
      padding: 12px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 30px rgba(0,0,0,0.8);
    }
    .tv-main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 40px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .tv-qr-giant {
      width: 280px;
      height: 280px;
      border-radius: 20px;
      border: 4px solid #ffd100;
      box-shadow: 0 0 35px rgba(255, 209, 0, 0.55);
      background: #ffd100;
    }
    .tv-countdown-number {
      font-size: 140px;
      font-weight: 950;
      color: #ffd100;
      font-family: 'Outfit', sans-serif;
      line-height: 1;
      text-shadow: 0 0 40px rgba(255, 209, 0, 0.8);
      animation: pulseCountdown 1s infinite alternate;
    }
    @keyframes pulseCountdown {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.1); filter: brightness(1.3); }
    }
    .tv-question-text {
      font-size: 38px;
      font-weight: 950;
      color: #ffffff;
      line-height: 1.25;
      font-family: 'Outfit', sans-serif;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    .tv-option-box {
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .tv-option-box.opt-a { background: linear-gradient(135deg, #e52d27 0%, #b31217 100%); border: 2px solid #ff4d4d; }
    .tv-option-box.opt-b { background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%); border: 2px solid #42a5f5; }
    .tv-option-box.opt-c { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); border: 2px solid #f1c40f; }
    .tv-option-box.opt-d { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); border: 2px solid #2ecc71; }
    
    .tv-option-box.correct-highlight {
      border: 4px solid #00e676 !important;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.9) !important;
      transform: scale(1.03);
      z-index: 5;
    }
    .tv-option-box.wrong-dimmed {
      opacity: 0.35;
      filter: grayscale(0.6);
    }
  </style>
</head>
<body class="trivia-tv-fullscreen">
  <!-- Header Bar -->
  <header class="tv-header-strip">
    <div style="display:flex; align-items:center; gap:16px;">
      <img src="img/logo.jpg" alt="Drinks & Wins" style="width:52px; height:52px; border-radius:12px; border:2px solid #ffd100; box-shadow:0 0 20px rgba(255,209,0,0.45);" />
      <div>
        <h1 style="margin:0; font-size:24px; font-weight:950; color:#ffd100; font-family:'Outfit', sans-serif; letter-spacing:0.5px;">DRINKS & WINS • TRIVIA EN VIVO</h1>
        <div id="tvGameTitle" style="font-size:14px; color:#e0e0e0; font-weight:800;">📍 Cargando Sala de Trivia...</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:20px;">
      <div style="text-align:right;">
        <div style="font-size:11px; color:#aaa; font-weight:800; text-transform:uppercase;">Únete en tu Celular:</div>
        <div style="font-size:15px; color:#ffffff; font-weight:900;" id="tvJoinUrlDisplay">drinks-wins.web.app</div>
      </div>
      <div id="tvPinBadge" style="background:#ffd100; color:#000; font-size:22px; font-weight:950; padding:8px 18px; border-radius:12px; font-family:'Outfit', sans-serif; letter-spacing:1px; box-shadow:0 0 15px rgba(255,209,0,0.5);">PIN: ----</div>
    </div>
  </header>

  <!-- Dynamic Game Views Container -->
  <main id="tvMainContent" class="tv-main-viewport">
    <div style="text-align:center; padding:60px 20px;">
      <span style="font-size:64px;">🧠</span>
      <h2 style="color:#ffd100; font-size:32px; margin-top:16px;">Conectando con Drinks & Wins TV...</h2>
      <p class="hint-text" style="font-size:16px;">Si no carga automáticamente, ingresa el PIN de la sala.</p>
    </div>
  </main>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase-config.js?v=193.0"></script>
  <script src="js/trivia-tv.js?v=193.0"></script>
</body>
</html>
