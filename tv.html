<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drinks & Wins TV — Trivia en Pantalla Completa</title>
  <link rel="icon" href="img/logo.jpg" />
  <link rel="stylesheet" href="css/styles.css?v=201.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900;950&family=Outfit:wght@600;700;800;900;950&display=swap" rel="stylesheet" />
  <!-- Canvas Confetti for Podium Grand Finale -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* TV Ultra-Wide & High Contrast Styles for Sports Bar / Perimeter Displays */
    body.trivia-tv-fullscreen {
      background: radial-gradient(circle at center top, #141f36 0%, #060911 100%);
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tv-header-strip {
      background: rgba(8, 12, 20, 0.96);
      border-bottom: 3px solid #ffd100;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 35px rgba(0,0,0,0.9);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tv-main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 48px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .tv-qr-giant {
      width: 340px;
      height: 340px;
      border-radius: 24px;
      border: 6px solid #ffd100;
      box-shadow: 0 0 45px rgba(255, 209, 0, 0.7);
      background: #ffd100;
      display: block;
      margin: 0 auto;
    }
    .tv-countdown-number {
      font-size: 200px;
      font-weight: 950;
      color: #ffd100;
      font-family: 'Outfit', sans-serif;
      line-height: 1;
      text-shadow: 0 0 60px rgba(255, 209, 0, 0.9);
      animation: pulseCountdownTV 1s infinite alternate;
    }
    @keyframes pulseCountdownTV {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.12); filter: brightness(1.4); }
    }
    .tv-question-text {
      font-size: 52px;
      font-weight: 950;
      color: #ffffff;
      line-height: 1.22;
      font-family: 'Outfit', sans-serif;
      text-shadow: 0 3px 15px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }
    .tv-option-box {
      border-radius: 22px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-height: 90px;
      box-sizing: border-box;
    }
    .tv-option-box.opt-a { background: linear-gradient(135deg, #e52d27 0%, #b31217 100%); border: 3px solid #ff4d4d; }
    .tv-option-box.opt-b { background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%); border: 3px solid #42a5f5; }
    .tv-option-box.opt-c { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); border: 3px solid #f1c40f; }
    .tv-option-box.opt-d { background: linear-gradient(135deg, #00b09b 0%, #2e7d32 100%); border: 3px solid #2ecc71; }
    
    .tv-option-box.correct-highlight {
      border: 6px solid #00e676 !important;
      background: linear-gradient(135deg, #00b09b 0%, #008f39 100%) !important;
      box-shadow: 0 0 50px rgba(0, 230, 118, 1) !important;
      transform: scale(1.04);
      z-index: 10;
    }
    .tv-option-box.wrong-dimmed {
      opacity: 0.25;
      filter: grayscale(0.85);
      transform: scale(0.97);
    }
  </style>
</head>
<body class="trivia-tv-fullscreen">
  <!-- Top Header Bar -->
  <header class="tv-header-strip">
    <div style="display:flex; align-items:center; gap:20px;">
      <img src="img/logo.jpg" alt="Drinks & Wins" style="width:60px; height:60px; border-radius:14px; border:2.5px solid #ffd100; box-shadow:0 0 25px rgba(255,209,0,0.5);" />
      <div>
        <h1 style="margin:0; font-size:28px; font-weight:950; color:#ffd100; font-family:'Outfit', sans-serif; letter-spacing:0.8px;">DRINKS & WINS • TRIVIA EN VIVO</h1>
        <div id="tvGameTitle" style="font-size:16px; color:#e0e0e0; font-weight:800;">📍 Cargando Sala de Trivia...</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:24px;">
      <div style="text-align:right;">
        <div style="font-size:13px; color:#ffd100; font-weight:900; text-transform:uppercase; letter-spacing:0.5px;">Únete con tu Celular en:</div>
        <div style="font-size:18px; color:#ffffff; font-weight:950;" id="tvJoinUrlDisplay">drinks-wins.web.app</div>
      </div>
      <div id="tvPinBadge" style="background:#ffd100; color:#000; font-size:32px; font-weight:950; padding:10px 24px; border-radius:16px; font-family:'Outfit', sans-serif; letter-spacing:2px; box-shadow:0 0 25px rgba(255,209,0,0.65);">
        PIN: ----
      </div>
      <div style="display:flex; gap:10px;">
        <button type="button" onclick="window.resetTriviaToLobby()" style="background:rgba(255,77,77,0.15); border:1.5px solid #ff4d4d; color:#ff4d4d; font-size:14px; font-weight:800; padding:10px 16px; border-radius:12px; cursor:pointer;" title="Regresar al Lobby">
          ⏹️ Lobby / Reiniciar
        </button>
        <button type="button" onclick="window.showTVRoomSelector()" style="background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.3); color:#fff; font-size:14px; font-weight:800; padding:10px 16px; border-radius:12px; cursor:pointer;" title="Cambiar Sala de Trivia">
          🔄 Cambiar Sala
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Game Views Container -->
  <main id="tvMainContent" class="tv-main-viewport">
    <div style="text-align:center; padding:80px 20px;">
      <span style="font-size:72px;">🧠</span>
      <h2 style="color:#ffd100; font-size:36px; margin-top:20px; font-family:'Outfit', sans-serif;">Cargando Drinks & Wins TV...</h2>
      <p class="hint-text" style="font-size:18px;">Conectando con el servidor en tiempo real...</p>
    </div>
  </main>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase-config.js?v=201.0"></script>
  <script src="js/auth.js?v=201.0"></script>
  <script src="js/trivia-tv.js?v=201.0"></script>
</body>
</html>
